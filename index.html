
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BarkerBox - Subscribe and Save!</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main subscription container -->
    <div class="container">

        <!-- Featured dog image -->
        <img src="dog.jpg" alt="Happy dog with toys" class="featured-img">

        <!-- Product heading -->
        <h1 class="heading">BarkerBox</h1>

        <h2>Get 15% Off Your First Box!</h2>

        <!-- Product description -->
        <p class="description">
            Discover a monthly subscription box that brings an assortment
            of unique, playful, and durable toys that dogs will love.
            Subscribe now and enjoy exclusive benefits!
        </p>

        <!-- Registration form -->
        <form class="registration-form">

            <label for="name">Your Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit" class="cta-button">
                Get My 15% Off
            </button>

        </form>

        <p class="footer-text">
            Join the BarkerBox family today!
        </p>

    </div>

</body>
</html>
